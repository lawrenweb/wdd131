<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Product Review Form</title>
    <meta name="description" content="Complete a product review form by selecting a product, providing a rating, choosing useful features, and sharing feedback about your experience.">
    <meta name="author" content="Lawren Talamaivao">
   

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
    
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form method="get" action="review.html">

        <label for="productName">Product Name *</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>Select a Product ...</option>
        </select>

        <fieldset>
            <legend>Overall Rating *</legend>

            <label><input type="radio" name="rating" id="rating1" value="1" required> ☆</label>
            <label><input type="radio" name="rating" id="rating2" value="2"> ☆☆</label>
            <label><input type="radio" name="rating" id="rating3" value="3"> ☆☆☆</label>
            <label><input type="radio" name="rating" id="rating4" value="4"> ☆☆☆☆</label>
            <label><input type="radio" name="rating" id="rating5" value="5"> ☆☆☆☆☆</label>
        </fieldset>

        <label for="installDate">Date of Installation *</label>
        <input type="date" id="installDate" name="installDate" required>

     <fieldset>
           <legend>Overall Rating *</legend>

             <label>
              <input type="radio" id="rating1" name="rating" value="1" required>
            ☆
             </label>

             <label>
          <input type="radio" id="rating2" name="rating" value="2" required>
          ☆☆
            </label>

          <label>
          <input type="radio" id="rating3" name="rating" value="3" required>
           ☆☆☆
           </label>

             <label>
           <input type="radio" id="rating4" name="rating" value="4" required>
          ☆☆☆☆
          </label>

            <label>
        <input type="radio" id="rating5" name="rating" value="5" required>
        ☆☆☆☆☆
             </label>
</fieldset>

        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5"></textarea>

        <label for="username">Your Name</label>
        <input type="text" id="username" name="username">

        <input type="submit" value="Submit Review">

    </form>
</main>

<footer>
    <p>&copy; <span id="year"></span> | Lawren Talamaivao | New Zealand</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
