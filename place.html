<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A country page about Samoa">
    <meta name="author" content="Lawren Talamaivao">

    <title>Samoa Country Page</title>

<link rel="stylesheet" href="styles
    
</head>
<body>

    <header>
        <h1>Samoa</h1>
    </header>

    <main>

     <picture>
    <source media="(min-width: 768px)" srcset="images/samoa-large.webp">
    <img src="images/samoa-small.webp" alt="Beautiful landscape of Samoa">
</picture>

        <section class="data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 2,842 km²</p>
            <p><strong>Population:</strong> 222,382</p>
            <p><strong>Capital:</strong> Apia</p>
            <p><strong>Languages:</strong> Samoan, English</p>
            <p><strong>Currency:</strong> Tala (WST)</p>
            <p><strong>Time Zone:</strong> UTC +13</p>
            <p><strong>Calling Code:</strong> +685</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather icon" class="weather-icon">

            <p><strong>Conditions:</strong> Partly Cloudy</p>
            <p><strong>Wind:</strong> <span id="windspeed">5</span> km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </section>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Lawren Talamaivao | Samoa
        </p>

        <p id="lastModified"></p>
    </footer>

   <script src="scripts/place.js" defer></script>


</body>
</html>
